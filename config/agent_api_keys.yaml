# =============================================================================
# theFactory — Agent API Key Configuration
# =============================================================================
# SECURITY: This file will contain LIVE API KEYS once populated.
#   - Do NOT commit this file to version control with keys present.
#   - Encrypt this file before storing or sharing.
#   - Use `sops`, `age`, or `git-crypt` to encrypt at rest.
#
# Instructions:
#   1. Paste each provider's API key in the designated field below.
#   2. Each agent has a primary provider/model and a fallback.
#   3. After populating, encrypt this file before committing.
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# PROVIDER API KEYS (Global — shared across agents using each provider)
# ─────────────────────────────────────────────────────────────────────────────

openai:
  api_key: "" # <-- Paste your OpenAI API key here
  base_url: "https://api.openai.com/v1"
  timeout_seconds: 20

anthropic:
  api_key: "" # <-- Paste your Anthropic API key here
  base_url: "https://api.anthropic.com/v1"
  version: "2023-06-01"
  timeout_seconds: 20

gemini:
  api_key: "" # <-- Paste your Google Gemini API key here
  base_url: "https://generativelanguage.googleapis.com/v1beta"
  timeout_seconds: 20

# ─────────────────────────────────────────────────────────────────────────────
# PER-AGENT KEY OVERRIDES (optional — leave blank to use global provider key)
# Fill these in ONLY if you need per-agent key isolation.
# ─────────────────────────────────────────────────────────────────────────────

agents:
