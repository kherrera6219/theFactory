[project]
name = "thefactory"
version = "0.1.0"
description = "Holy Grail application monorepo"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=120 --timeout-method=thread"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]
# Re-export façades: submodule symbols are intentionally surfaced on the
# package namespace for backward-compatible imports and test monkeypatching.
"services/orchestrator/orchestrator/llm_delegation/__init__.py" = ["F401"]

[tool.coverage.run]
branch = true
source = ["services", "shared_runtime"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
