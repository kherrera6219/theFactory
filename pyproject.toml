[project]
name = "thefactory"
version = "0.1.0"
description = "Holy Grail application monorepo"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.coverage.run]
branch = true
source = ["services"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
