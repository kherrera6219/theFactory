name: Weekly Qualification

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            services/*/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r services/api-gateway/requirements.txt
          pip install -r services/agent-runtime/requirements.txt
          pip install -r services/orchestrator/requirements.txt
          pip install -r services/pod-worker/requirements.txt
          pip install -r services/audit-worker/requirements.txt

      - name: Validate schemas and RefinedIR catalog
        run: |
          python scripts/validate_schemas.py
          python scripts/build_refined_ir_catalog.py

      # The stack could never start without these two steps. postgres runs a
      # TLS entrypoint that copies /run/postgres-certs/server.{crt,key} under
      # `set -e`; the certs live in deploy/.local, which is gitignored, so in CI
      # the bind mount produced an empty directory, the copy failed, and the
      # container exited ~0.5s after start. Compose reported that as
      # "postgres is unhealthy" -- which read like a slow boot rather than a
      # missing file, and left this workflow red every week.
      - name: Generate dev TLS certs
        run: sh scripts/generate_dev_tls_certs.sh

      - name: Write CI .env
        run: |
          sh scripts/write_ci_env.sh
          cp .env deploy/.env

      # neo4j, minio and milvus are not optional here. The orchestrator's
      # /readyz ANDs in every backend whose *_ENABLED flag is set, and the env
      # has NEO4J_ENABLED, OBJECT_STORAGE_ENABLED and MILVUS_ENABLED true.
      # Starting without them meant /readyz could never return 200, so the auth
      # matrix reported "readyz failed" for all three modes and 502 on
      # /v1/operations/summary. ci.yml's perf-smoke stack has always started
      # them, which is why it passes. Supply what readiness checks rather than
      # switching the checks off.
      - name: Start qualification stack
        run: |
          docker compose -f deploy/docker-compose.yaml up -d --build \
            redis postgres qdrant neo4j minio milvus orchestrator api-gateway \
            pod-a-worker pod-b-worker pod-c-worker pod-d-worker audit-worker
          docker compose -f deploy/docker-compose.yaml --profile dedicated-agents up -d \
            pod-a-dedicated-mgr-worker pod-b-dedicated-mgr-worker \
            pod-c-dedicated-mgr-worker pod-d-dedicated-mgr-worker

      # `up -d` returns when containers are created, not when they serve. The
      # orchestrator runs schema migrations on boot, and the gateway's /readyz
      # requires the orchestrator's /livez plus a Redis ping, so the matrix used
      # to start against a stack that had not finished booting. ci.yml has always
      # waited here; this workflow never did. On failure, dump state -- the last
      # run failed with "readyz failed" for all three auth modes and a bare 502,
      # which says the gateway could not reach the orchestrator but not why.
      - name: Wait for gateway and orchestrator readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8100/readyz >/dev/null 2>&1 && curl -fsS http://localhost:8101/readyz >/dev/null 2>&1; then
              echo "gateway and orchestrator ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::stack did not become ready in time" >&2
          docker compose -f deploy/docker-compose.yaml ps
          curl -sS http://localhost:8100/readyz || true
          curl -sS http://localhost:8101/readyz || true
          docker compose -f deploy/docker-compose.yaml logs --tail=120 api-gateway orchestrator postgres pgbouncer neo4j minio milvus
          exit 1

      - name: Operator route auth matrix
        # This CI job's stack is disposable (built fresh above, torn down in
        # "Shutdown qualification stack" below), so --execute is safe and
        # required here — without it the qualification silently no-ops
        # (dry-run) and reports no pass/fail verdict.
        run: python scripts/operator_route_auth_matrix_qualification.py --execute

      - name: Dedicated-agent canary trend
        run: python scripts/dedicated_agent_canary_trend.py

      - name: LangGraph v2 prototype matrix
        run: python scripts/langgraph_v2_prototype_matrix.py --allow-prototype-failure

      - name: Mission artifact qualification
        run: |
          python scripts/mission_artifact_qualification.py \
            --profile-label weekly-qualification \
            --output-file docs/evidence/mission_artifact_qualification_latest.json \
            --history-file docs/evidence/mission_artifact_qualification_history.jsonl

      - name: Qualification summary
        run: |
          python scripts/qualification_gate_summary.py \
            --policy-file deploy/promotion-policy.json \
            --output-file docs/evidence/qualification_gate_summary_latest.json

      - name: DORA metrics summary
        run: |
          python scripts/dora_metrics_summary.py \
            --output-file docs/evidence/dora_metrics_latest.json

      - name: Upload qualification artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: weekly-qualification-artifacts
          path: |
            docs/evidence/operator_route_oidc_matrix_latest.json
            docs/evidence/operator_route_oidc_matrix_history.jsonl
            docs/evidence/dedicated_agent_canary_trend_latest.json
            docs/evidence/dedicated_agent_canary_trend_history.jsonl
            docs/evidence/langgraph_v2_prototype_matrix_latest.json
            docs/evidence/langgraph_v2_prototype_matrix_history.jsonl
            docs/evidence/mission_artifact_qualification_latest.json
            docs/evidence/mission_artifact_qualification_history.jsonl
            docs/evidence/qualification_gate_summary_latest.json
            docs/evidence/dora_metrics_latest.json
          if-no-files-found: error

      - name: Shutdown qualification stack
        if: always()
        run: |
          docker compose -f deploy/docker-compose.yaml --profile dedicated-agents down -v
