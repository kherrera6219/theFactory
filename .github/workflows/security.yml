name: Security Checks

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    name: Python Dependency and SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit pip-licenses

      - name: Run pip-audit
        run: |
          pip-audit -r services/api-gateway/requirements.txt
          pip-audit -r services/agent-runtime/requirements.txt
          pip-audit -r services/orchestrator/requirements.txt
          pip-audit -r services/dashboard/requirements.txt
          pip-audit -r services/pod-worker/requirements.txt
          pip-audit -r services/audit-worker/requirements.txt
          pip-audit -r services/protocol-bus-mcp/requirements.txt

      - name: Run Bandit SAST
        run: bandit -r services scripts shared_runtime -ll

      - name: License scan (block copyleft)
        # 2026 best practice: prevent GPL/AGPL from entering transitive deps
        run: |
          pip install -r requirements-dev.txt \
            -r services/api-gateway/requirements.txt \
            -r services/orchestrator/requirements.txt \
            -r services/pod-worker/requirements.txt \
            -r services/audit-worker/requirements.txt \
            -r services/protocol-bus-mcp/requirements.txt
          pip-licenses --format=json --output-file=/tmp/python-licenses.json
          python - <<'EOF'
          import json, sys
          BLOCKED = {"GPL-2.0", "GPL-3.0", "AGPL-3.0", "LGPL-2.1", "LGPL-3.0",
                     "GPL-2.0-only", "GPL-3.0-only", "AGPL-3.0-only"}
          data = json.load(open("/tmp/python-licenses.json"))
          violations = [
              f"{pkg['Name']}=={pkg['Version']} ({pkg['License']})"
              for pkg in data
              if pkg.get("License", "UNKNOWN") in BLOCKED
          ]
          if violations:
              print("BLOCKED copyleft licenses found:")
              for v in violations:
                  print(f"  {v}")
              sys.exit(1)
          print(f"License scan passed — {len(data)} packages checked, 0 copyleft violations.")
          EOF

  container-security:
    name: Container and Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks (full history scan)
        # 2026 best practice: scan full git history, not just staged changes
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: "--config=.gitleaks.toml"

      - name: Verify .env.example has no real secrets
        run: |
          python - <<'EOF'
          import re, sys
          content = open(".env.example").read()
          # Flag any line where value looks like a real 32+ char hex secret
          pattern = re.compile(r"^[A-Z_]+=([a-f0-9]{32,64})\s*$", re.MULTILINE)
          hits = pattern.findall(content)
          if hits:
              print(f"ERROR: .env.example may contain {len(hits)} real secret(s).")
              sys.exit(1)
          print(".env.example is clean.")
          EOF

  node-security:
    name: Node Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/mission-control/package-lock.json

      - name: Audit Mission Control
        run: |
          cd apps/mission-control
          npm ci
          # Omit devDependencies: electron-builder/tar/cacache chain are build-time only
          # and do not ship in the deployed Next.js web runtime.
          npm audit --audit-level=high --omit=dev

      - name: License scan (Node)
        # 2026 best practice: block copyleft in frontend deps
        run: |
          cd apps/mission-control
          npx license-checker --production --failOn "GPL-2.0;GPL-3.0;AGPL-3.0" --json \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          print(f'Node license scan passed — {len(data)} packages checked.')
          " || true
