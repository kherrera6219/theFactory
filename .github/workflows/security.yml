name: Security Checks

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  python-security:
    name: Python Dependency and SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: Run pip-audit
        run: |
          pip-audit -r services/api-gateway/requirements.txt
          pip-audit -r services/agent-runtime/requirements.txt
          pip-audit -r services/orchestrator/requirements.txt
          pip-audit -r services/dashboard/requirements.txt
          pip-audit -r services/pod-worker/requirements.txt
          pip-audit -r services/audit-worker/requirements.txt
          pip-audit -r services/semantic-bus-mcp/requirements.txt

      - name: Run Bandit
        run: bandit -r services scripts -ll

  container-security:
    name: Container and Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2

  node-security:
    name: Node Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/mission-control/package-lock.json

      - name: Audit Mission Control
        run: |
          cd apps/mission-control
          npm ci
          npm audit --audit-level=high
