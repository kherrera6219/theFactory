name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  staging-validation:
    name: Staging Validation
    runs-on: ubuntu-latest
    # Fix 3 (Phase 3): pre-production gate. Configure the `staging` environment in
    # repo Settings → Environments (optionally with required reviewers / wait timer)
    # to validate a release candidate before the production publish job runs.
    environment:
      name: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate release tag is signed and well-formed
        run: |
          echo "Validating release candidate ${GITHUB_REF_NAME} for staging promotion"
          case "${GITHUB_REF_NAME}" in
            v*) echo "Tag format OK" ;;
            *) echo "::error::Release tag must start with 'v'"; exit 1 ;;
          esac

  publish-images:
    name: Publish Backend Images to GHCR
    needs: staging-validation
    runs-on: ubuntu-latest
    # Same production-environment approval gate as the installer release job
    # below -- pushing images to a registry under this account is a real,
    # visible action, not just a build artifact upload.
    environment:
      name: production
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: orchestrator
            context: .
            dockerfile: services/orchestrator/Dockerfile
          - service: api-gateway
            context: .
            dockerfile: services/api-gateway/Dockerfile
          - service: protocol-bus-mcp
            context: .
            dockerfile: services/protocol-bus-mcp/Dockerfile
          - service: dashboard
            context: .
            dockerfile: services/dashboard/Dockerfile
          - service: pod-worker
            context: .
            dockerfile: services/pod-worker/Dockerfile
          - service: audit-worker
            context: .
            dockerfile: services/audit-worker/Dockerfile
          - service: agent-runtime
            context: .
            dockerfile: services/agent-runtime/Dockerfile
          - service: mission-control
            context: apps/mission-control
            dockerfile: apps/mission-control/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/thefactory-${{ matrix.service }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/thefactory-${{ matrix.service }}:latest

  release:
    name: Production Release
    needs: staging-validation
    runs-on: windows-latest
    # Fix 3 (Phase 3): gate production releases behind a GitHub Environment.
    # Configure the `production` environment in repo Settings → Environments with
    # required reviewers so a tag push pauses for manual approval before publishing.
    # See docs/OPERATIONS_RUNBOOK.md → "Release Environments & Approvals".
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/mission-control/package-lock.json

      - name: Install dependencies
        working-directory: apps/mission-control
        run: npm ci

      - name: Build Electron App
        working-directory: apps/mission-control
        run: npm run electron:package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Future: CSC_LINK and CSC_KEY_PASSWORD for code signing

      - name: Publish release artifacts
        id: deploy
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: apps/mission-control/dist/installers/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
