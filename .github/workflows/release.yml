name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/mission-control/package-lock.json

      - name: Install dependencies
        working-directory: apps/mission-control
        run: npm ci

      - name: Build Electron App
        working-directory: apps/mission-control
        run: npm run electron:package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Future: CSC_LINK and CSC_KEY_PASSWORD for code signing

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mission-control/dist/installers/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
