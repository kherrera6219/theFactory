name: Live Stack Gate

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read

jobs:
  live-stack-gate:
    name: Non-Skippable Live Stack Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            services/*/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r services/api-gateway/requirements.txt
          pip install -r services/agent-runtime/requirements.txt
          pip install -r services/orchestrator/requirements.txt
          pip install -r services/pod-worker/requirements.txt
          pip install -r services/audit-worker/requirements.txt

      - name: Generate dev TLS certs and CI env
        env:
          LLM_PROVIDER: ${{ secrets.QUALIFICATION_LLM_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.QUALIFICATION_GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.QUALIFICATION_ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.QUALIFICATION_OPENAI_API_KEY }}
        run: |
          sh scripts/generate_dev_tls_certs.sh
          sh scripts/write_ci_env.sh
          cp .env deploy/.env

      - name: Start live Compose stack
        run: |
          docker compose -f deploy/docker-compose.yaml up -d --build \
            redis postgres qdrant neo4j object-store milvus protocol-bus-mcp sandbox-runner \
            orchestrator api-gateway pod-a-worker pod-b-worker pod-c-worker pod-d-worker audit-worker

      - name: Wait for stack readiness
        run: sh scripts/wait_for_stack_ready.sh

      - name: Run non-skippable live stack integration gate
        env:
          LIVE_STACK_ENABLED: "1"
          LIVE_STACK_REQUIRED: "1"
        run: |
          python -m pytest \
            tests/services/test_live_mission_flow_integration.py \
            tests/services/test_live_extended_data_plane_integration.py \
            -q -rs

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f deploy/docker-compose.yaml ps || true
          docker compose -f deploy/docker-compose.yaml logs --tail=80 orchestrator api-gateway || true

      - name: Tear down live stack
        if: always()
        run: docker compose -f deploy/docker-compose.yaml down -v || true
