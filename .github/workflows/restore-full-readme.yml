name: restore-full-readme
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-full-readme.yml"
      - "scripts/restore_full_readme.py"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Rebuild long-form README from ce9e042 plus status patches
        run: python3 scripts/restore_full_readme.py
      - name: Commit and push if README changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README already current"
            exit 0
          fi
          git commit -m "docs: restore full README with continuity bus and repo ZIP phases 5-7 status"
          git push
