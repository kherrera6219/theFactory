name: CI

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint-test:
    name: Lint and Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            services/*/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r services/api-gateway/requirements.txt
          pip install -r services/agent-runtime/requirements.txt
          pip install -r services/orchestrator/requirements.txt
          pip install -r services/dashboard/requirements.txt
          pip install -r services/pod-worker/requirements.txt
          pip install -r services/audit-worker/requirements.txt
          pip install -r services/protocol-bus-mcp/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/mission-control/package-lock.json

      - name: Install Mission Control deps
        run: npm ci
        working-directory: apps/mission-control

      - name: Verify generated API types are in sync
        run: |
          npm run gen:api
          if ! git diff --exit-code -- app/lib/types/api.gen.ts; then
            echo "::error::Generated API types are out of date. Run 'npm run gen:api' in apps/mission-control and commit the result." >&2
            exit 1
          fi
        working-directory: apps/mission-control

      - name: Validate schemas
        run: |
          python scripts/validate_schemas.py
          python scripts/build_refined_ir_catalog.py

      - name: Production Audit (Checklist Baseline)
        run: python scripts/production_review_audit.py

      - name: Lint
        run: ruff check services tests scripts

      - name: Mission Control Lint
        run: npm run lint
        working-directory: apps/mission-control

      - name: Mission Control Unit Tests
        run: npm run test
        working-directory: apps/mission-control

      - name: Mission Control Build
        run: npm run build
        working-directory: apps/mission-control
        env:
          NEXT_BUILD_TARGET: docker

      - name: Mission Control Performance Budget (Lighthouse CI)
        run: npm run test:perf
        working-directory: apps/mission-control
        env:
          MISSION_CONTROL_BYPASS_AUTH: "true"
          NEXT_BUILD_TARGET: docker

      - name: Install Playwright Browser (Chromium)
        run: npx playwright install --with-deps chromium
        working-directory: apps/mission-control

      - name: Mission Control E2E Tests
        run: npm run test:e2e
        working-directory: apps/mission-control
        env:
          MISSION_CONTROL_BYPASS_AUTH: "true"
          NEXT_BUILD_TARGET: docker

      - name: Test with Coverage
        run: |
          mkdir -p reports
          pytest --cov=services --cov=shared_runtime --cov-report=term-missing --cov-report=xml --cov-fail-under=80 --junitxml=reports/junit.xml
          python scripts/check_coverage_thresholds.py \
            --coverage-file coverage.xml \
            --global-threshold 80 \
            --module-threshold services/pod-worker/pod_worker/main.py=80 \
            --module-threshold services/audit-worker/audit_worker/main.py=90 \
            --module-threshold services/protocol-bus-mcp/protocol_bus/mcp_server.py=100 \
            --module-threshold services/orchestrator/orchestrator/protocol.py=100 \
            --module-threshold services/orchestrator/orchestrator/runtime.py=80 \
            --module-threshold services/orchestrator/orchestrator/agent_personas.py=100 \
            --module-threshold services/orchestrator/orchestrator/agent_integrations.py=100 \
            --module-threshold services/orchestrator/orchestrator/agent_registry.py=100

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: test-artifacts-py${{ matrix.python-version }}
          path: |
            reports/junit.xml
            coverage.xml
          if-no-files-found: error

  perf-smoke:
    name: Performance Smoke (p95 gate)
    # Heavy job that boots the Docker stack — runs on manual dispatch and on
    # pushes to main only, so it never blocks ordinary pull requests.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install perf smoke deps
        run: python -m pip install --upgrade pip httpx

      - name: Generate dev TLS certs
        run: sh scripts/generate_dev_tls_certs.sh

      - name: Write CI .env
        run: |
          # Derive a CI .env from the example, swapping every CHANGE_ME secret
          # for a deterministic 32-char dev value so check_env.py passes.
          sed -E \
            -e 's/CHANGE_ME_local_dev_redis_password_32chars/ci_dev_redis_password_0123456789abcd/g' \
            -e 's/CHANGE_ME_local_dev_postgres_password_32chars/ci_dev_postgres_password_0123456789ab/g' \
            -e 's/CHANGE_ME[A-Za-z0-9_]*/ci_dev_secret_value_0123456789abcdef/g' \
            .env.example > .env
          {
            echo "INTERNAL_SERVICE_API_KEY=ci-internal-service-key"
            echo "ORCHESTRATOR_ADMIN_API_KEY=ci-admin-key"
            echo "AUTH_MODE=api_key"
            echo "KNOWLEDGE_EMBEDDING_PROVIDER=deterministic"
            echo "KNOWLEDGE_EMBEDDING_MODEL=deterministic-hash-v1"
            # .env.example points MIGRATION_POSTGRES_URL's sslrootcert at the
            # host path (deploy/.local/...), which does not exist inside the
            # orchestrator container (certs are mounted at /run/postgres-certs).
            # The wrong path makes every schema-migration connection fail, so
            # db_ready never flips true and each /health probe re-runs the
            # failing migration until the 3s healthcheck times out. Override
            # with the in-container cert path so migrations succeed.
            echo "MIGRATION_POSTGRES_URL=postgresql://postgres:ci_dev_postgres_password_0123456789ab@postgres:5432/ulr?sslmode=verify-full&sslrootcert=/run/postgres-certs/ca.crt"
            # protocol-bus-mcp is not part of the perf-smoke stack; keep the
            # optional consumer off so it never adds startup work in CI.
            echo "PROTOCOL_BUS_CONSUMER_ENABLED=false"
            # jaeger is absent from the perf-smoke stack; disabling tracing
            # skips the per-/health socket probe to jaeger:4318.
            echo "OTEL_TRACING_ENABLED=false"
            # CI Redis stack uses dev config: plaintext on port 6379, no TLS.
            # The derived .env has TLS port 6380 + cert paths that don't exist in CI.
            echo "REDIS_URL=redis://:ci_dev_redis_password_0123456789abcd@redis:6379/0"
            # PgBouncer in CI uses edoburu image which defaults to md5 auth.
            # Postgres pg_hba.conf uses scram-sha-256, causing "wrong password type".
            # Override PgBouncer to use scram-sha-256 to match.
            echo "PGBOUNCER_AUTH_TYPE=scram-sha-256"
            # Also override MIGRATION_POSTGRES_URL to bypass PgBouncer for migrations.
            # Use direct Postgres with plaintext (no TLS in CI dev stack).
            echo "MIGRATION_POSTGRES_URL=postgresql://postgres:ci_dev_postgres_password_0123456789ab@postgres:5432/ulr?sslmode=disable"
          } >> .env
          cp .env deploy/.env

      - name: Start default data-plane stack
        run: |
          docker compose -f deploy/docker-compose.yaml -f deploy/docker-compose.dev.yaml \
            up -d --build redis postgres qdrant neo4j minio milvus orchestrator api-gateway

      - name: Wait for API gateway health
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8100/health >/dev/null 2>&1; then
              echo "api-gateway healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::api-gateway did not become healthy in time" >&2
          docker compose -f deploy/docker-compose.yaml -f deploy/docker-compose.dev.yaml ps
          docker compose -f deploy/docker-compose.yaml -f deploy/docker-compose.dev.yaml logs --tail=100 api-gateway orchestrator
          exit 1

      - name: Run performance smoke test (p95 <= 2s)
        run: python scripts/perf_smoke.py --base-url http://localhost:8100

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yaml -f deploy/docker-compose.dev.yaml logs --tail=200

      - name: Tear down stack
        if: always()
        run: docker compose -f deploy/docker-compose.yaml -f deploy/docker-compose.dev.yaml down -v

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - agent-runtime
          - orchestrator
          - dashboard
          - pod-worker
          - audit-worker
          - protocol-bus-mcp
    env:
      IMAGE_TAG: thefactory/${{ matrix.service }}:ci
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_TAG }}

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-version-check: true
          # exit-code 0: upload findings to Security tab but don't block the build.
          # Real CVEs will appear in GitHub Security → Code scanning alerts.
          # Change to "1" once a baseline suppression file (.trivyignore) is in place.
          exit-code: "0"

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-${{ matrix.service }}

  electron-e2e:
    name: Electron E2E Smoke
    # Production signal: run on main pushes and release tags, with manual
    # dispatch retained for explicit operator validation.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/mission-control/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: apps/mission-control

      - name: Install Playwright (Chromium + system deps)
        run: npx playwright install --with-deps chromium
        working-directory: apps/mission-control

      - name: Build Electron app
        run: npm run electron:build
        working-directory: apps/mission-control
        env:
          NEXT_BUILD_TARGET: docker

      - name: Run Electron E2E smoke tests
        # xvfb provides a virtual display for the Electron window on headless Linux.
        run: xvfb-run --auto-servernum npm run test:e2e:electron
        working-directory: apps/mission-control
        env:
          MISSION_CONTROL_BYPASS_AUTH: "true"

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          output-file: sbom.spdx.json
          format: spdx-json

      # 2026 best practice: generate both SPDX and CycloneDX formats (SLSA compliance)
      - name: Generate SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          output-file: sbom.cdx.json
          format: cyclonedx-json

      - name: Upload SBOM
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cdx.json
          if-no-files-found: error

  release-trust:
    name: Release Trust and Promotion Gate
    needs:
      - lint-test
      - docker-build
      - sbom
    if: always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Require upstream production gates
        run: |
          failed=0
          if [ "${{ needs.lint-test.result }}" != "success" ]; then
            echo "::error::Lint and Test gate result: ${{ needs.lint-test.result }}"
            failed=1
          fi
          if [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "::error::Docker Build Validation gate result: ${{ needs.docker-build.result }}"
            failed=1
          fi
          if [ "${{ needs.sbom.result }}" != "success" ]; then
            echo "::error::SBOM gate result: ${{ needs.sbom.result }}"
            failed=1
          fi
          exit "$failed"

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize signed tag verification artifact
        run: |
          mkdir -p reports
          printf 'signed_tag_verified=false\n' > reports/signed-tag-verification.txt

      - name: Download test artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-artifacts-py3.11
          path: reports/input-artifacts/test-artifacts-py3.11
        timeout-minutes: 5

      - name: Download SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: reports/input-artifacts/sbom
        timeout-minutes: 5

      - name: Build release manifest
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path

          root = Path("reports/input-artifacts")
          root.mkdir(parents=True, exist_ok=True)
          files = []
          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              files.append(
                  {
                      "path": path.relative_to(root).as_posix(),
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "bytes": path.stat().st_size,
                  }
              )

          manifest = {
              "repository": "${{ github.repository }}",
              "ref": "${{ github.ref }}",
              "commit": "${{ github.sha }}",
              "run_id": "${{ github.run_id }}",
              "run_attempt": "${{ github.run_attempt }}",
              "artifacts": files,
          }
          output = Path("reports/release-manifest.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(f"wrote {output} with {len(files)} artifact records")
          PY

      - name: Upload release manifest artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-manifest
          path: reports/release-manifest.json
          if-no-files-found: error

      - name: Attest release manifest provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: reports/release-manifest.json

      - name: Verify release manifest attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if gh attestation verify reports/release-manifest.json \
              --repo "${{ github.repository }}" \
              > reports/attestation-verification.txt \
              2> reports/attestation-verification.err; then
              exit 0
            fi
            cat reports/attestation-verification.err
            sleep 10
          done
          exit 1

      - name: Import release tag verification key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG_GPG_PUBLIC_KEY: ${{ secrets.RELEASE_TAG_GPG_PUBLIC_KEY }}
        run: |
          if [ -z "${RELEASE_TAG_GPG_PUBLIC_KEY}" ]; then
            echo "Missing RELEASE_TAG_GPG_PUBLIC_KEY secret for release tag verification" >&2
            exit 1
          fi
          printf '%s' "${RELEASE_TAG_GPG_PUBLIC_KEY}" > /tmp/release-tag.asc
          gpg --batch --import /tmp/release-tag.asc

      - name: Verify signed release tag
        id: tag_verification
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p reports
          git tag -v "${GITHUB_REF_NAME}" > reports/signed-tag-verification.txt 2>&1
          echo "signed_tag_verified=true" >> "${GITHUB_OUTPUT}"

      - name: Install cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Sign release manifest and SBOM
        run: |
          mkdir -p reports/cosign
          cosign sign-blob --yes \
            --output-signature reports/cosign/release-manifest.sig \
            --output-certificate reports/cosign/release-manifest.pem \
            reports/release-manifest.json
          cosign sign-blob --yes \
            --output-signature reports/cosign/sbom.sig \
            --output-certificate reports/cosign/sbom.pem \
            reports/input-artifacts/sbom/sbom.spdx.json

      - name: Verify cosign signatures
        run: |
          COSIGN_IDENTITY_RE="^https://github.com/${{ github.repository }}/.github/workflows/ci.yml@.*$"
          cosign verify-blob \
            --certificate reports/cosign/release-manifest.pem \
            --signature reports/cosign/release-manifest.sig \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "${COSIGN_IDENTITY_RE}" \
            reports/release-manifest.json > reports/cosign/release-manifest.verify.txt
          cosign verify-blob \
            --certificate reports/cosign/sbom.pem \
            --signature reports/cosign/sbom.sig \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "${COSIGN_IDENTITY_RE}" \
            reports/input-artifacts/sbom/sbom.spdx.json > reports/cosign/sbom.verify.txt

      - name: Export agent model inventory
        run: |
          python scripts/export_agent_model_inventory.py \
            --output-file reports/agent-model-inventory.json

      - name: Summarize qualification evidence
        continue-on-error: ${{ github.ref == 'refs/heads/main' }}
        run: |
          python scripts/qualification_gate_summary.py \
            --policy-file deploy/promotion-policy.json \
            --output-file reports/qualification-gate-summary.json

      - name: Evaluate promotion gate policy
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNED_TAG_VERIFIED: ${{ steps.tag_verification.outputs.signed_tag_verified || 'false' }}
        run: |
          python scripts/promotion_gate.py \
            --policy-file deploy/promotion-policy.json \
            --ref "${{ github.ref }}" \
            --ci-status success \
            --attestation-verified true \
            --signed-tag-verified "${SIGNED_TAG_VERIFIED}" \
            --model-inventory-file reports/agent-model-inventory.json \
            --qualification-summary-file reports/qualification-gate-summary.json \
            --output-file reports/promotion-decision.json

      - name: Record branch promotion gate deferral
        if: github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          from datetime import UTC, datetime
          from pathlib import Path

          payload = {
              "allowed": False,
              "reasons": [
                  "strict promotion policy is evaluated on release tags; main publishes trust evidence only"
              ],
              "policy_version": 3,
              "ref": "${{ github.ref }}",
              "ci_status": "success",
              "attestation_verified": True,
              "signed_tag_verified": False,
              "model_inventory_checked": True,
              "qualification_summary_checked": True,
              "evaluated_at": datetime.now(UTC).isoformat(),
          }
          output = Path("reports/promotion-decision.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload release trust artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-trust-artifacts
          path: |
            reports/release-manifest.json
            reports/attestation-verification.txt
            reports/signed-tag-verification.txt
            reports/agent-model-inventory.json
            reports/qualification-gate-summary.json
            reports/promotion-decision.json
            reports/cosign
          if-no-files-found: error
