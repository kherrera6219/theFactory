name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  lint-test:
    name: Lint and Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            services/*/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r services/api-gateway/requirements.txt
          pip install -r services/orchestrator/requirements.txt
          pip install -r services/dashboard/requirements.txt
          pip install -r services/pod-worker/requirements.txt
          pip install -r services/audit-worker/requirements.txt
          pip install -r services/semantic-bus-mcp/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/mission-control/package-lock.json

      - name: Install Mission Control deps
        run: npm ci
        working-directory: apps/mission-control

      - name: Validate schemas
        run: python scripts/validate_schemas.py

      - name: Production Audit (Checklist Baseline)
        run: python scripts/production_review_audit.py

      - name: Lint
        run: ruff check services tests scripts

      - name: Mission Control Lint
        run: npm run lint
        working-directory: apps/mission-control

      - name: Mission Control Unit Tests
        run: npm run test
        working-directory: apps/mission-control

      - name: Install Playwright Browser (Chromium)
        run: npx playwright install --with-deps chromium
        working-directory: apps/mission-control

      - name: Mission Control E2E Tests
        run: npm run test:e2e
        working-directory: apps/mission-control

      - name: Test with Coverage
        run: |
          mkdir -p reports
          pytest --cov=services --cov-report=term-missing --cov-report=xml --cov-fail-under=80 --junitxml=reports/junit.xml
          python scripts/check_coverage_thresholds.py \
            --coverage-file coverage.xml \
            --global-threshold 80 \
            --module-threshold services/pod-worker/pod_worker/main.py=100 \
            --module-threshold services/audit-worker/audit_worker/main.py=100 \
            --module-threshold services/semantic-bus-mcp/semantic_bus/mcp_server.py=100 \
            --module-threshold services/orchestrator/orchestrator/protocol.py=100 \
            --module-threshold services/orchestrator/orchestrator/runtime.py=100 \
            --module-threshold services/orchestrator/orchestrator/agent_personas.py=100 \
            --module-threshold services/orchestrator/orchestrator/agent_integrations.py=100 \
            --module-threshold services/orchestrator/orchestrator/agent_registry.py=100

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-py${{ matrix.python-version }}
          path: |
            reports/junit.xml
            coverage.xml
          if-no-files-found: error

  docker-build:
    name: Docker Build Validation
    needs: lint-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - orchestrator
          - dashboard
          - pod-worker
          - audit-worker
          - semantic-bus-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          load: false
          tags: thefactory/${{ matrix.service }}:ci

  sbom:
    name: SBOM
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          path: .
          output-file: sbom.spdx.json
          format: spdx-json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          if-no-files-found: error

  release-trust:
    name: Release Trust and Promotion Gate
    needs:
      - lint-test
      - docker-build
      - sbom
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CI artifacts
        uses: actions/download-artifact@v4
        with:
          path: reports/input-artifacts

      - name: Build release manifest
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path

          root = Path("reports/input-artifacts")
          root.mkdir(parents=True, exist_ok=True)
          files = []
          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              files.append(
                  {
                      "path": path.relative_to(root).as_posix(),
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "bytes": path.stat().st_size,
                  }
              )

          manifest = {
              "repository": "${{ github.repository }}",
              "ref": "${{ github.ref }}",
              "commit": "${{ github.sha }}",
              "run_id": "${{ github.run_id }}",
              "run_attempt": "${{ github.run_attempt }}",
              "artifacts": files,
          }
          output = Path("reports/release-manifest.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(f"wrote {output} with {len(files)} artifact records")
          PY

      - name: Upload release manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: reports/release-manifest.json
          if-no-files-found: error

      - name: Attest release manifest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: reports/release-manifest.json

      - name: Verify release manifest attestation
        run: |
          gh attestation verify reports/release-manifest.json --repo "${{ github.repository }}" > reports/attestation-verification.txt

      - name: Evaluate promotion gate policy
        run: |
          python scripts/promotion_gate.py \
            --policy-file deploy/promotion-policy.json \
            --ref "${{ github.ref }}" \
            --ci-status success \
            --attestation-verified true \
            --output-file reports/promotion-decision.json

      - name: Upload release trust artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-trust-artifacts
          path: |
            reports/release-manifest.json
            reports/attestation-verification.txt
            reports/promotion-decision.json
          if-no-files-found: error
