acceptance_checks:
  required_symbols:
    - com.example.legacy.LedgerCalc
    - netBalance
    - applyMonthlyFee
    - summarizeByAccount
  forbidden_regressions:
    - "Preserve Java 1.8 source/target in pom.xml and existing public method signatures"
