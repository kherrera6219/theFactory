<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
<title>Starting theFactory</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap {
    text-align: center;
    max-width: 420px;
  }
  .spinner {
    width: 36px;
    height: 36px;
    margin: 0 auto 20px;
    border: 3px solid #30363d;
    border-top-color: #2ea043;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  h1 { font-size: 16px; margin-bottom: 8px; }
  p { color: #9da7b3; font-size: 13px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <h1 id="statusTitle">Starting theFactory backend&hellip;</h1>
    <p id="statusDetail">First-time startup downloads several container images and can take a few minutes.</p>
  </div>
  <script>
    if (window.startingAPI) {
      window.startingAPI.onStatus((detail) => {
        document.getElementById("statusDetail").textContent = detail;
      });
    }
  </script>
</body>
</html>
