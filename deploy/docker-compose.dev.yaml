services:
  api-gateway:
    environment:
      AUTH_MODE: api_key
      API_RATE_LIMIT_PER_MINUTE: 240
      # Capture every trace locally for debugging; prod samples at 10%.
      OTEL_SAMPLING_RATIO: "1.0"
  orchestrator:
    environment:
      LANGGRAPH_ENABLED: "false"
      LANGGRAPH_CHECKPOINTER: none
      OTEL_SAMPLING_RATIO: "1.0"
  mission-control:
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_GATEWAY_HOST_PORT:-8100}
      NEXT_PUBLIC_RUNTIME_ENV: dev
