# Production pg_hba.conf — SSL-required for all remote connections.
#
# Mounted in the prod overlay (docker-compose.prod.yaml) and referenced by
# postgresql.conf via hba_file. Dev uses the image default pg_hba.conf, which
# permits plaintext for local debugging.
#
# TYPE   DATABASE  USER  ADDRESS       METHOD

# Container-internal tooling over the local Unix socket — no TLS needed.
local    all       all                 trust

# Require SSL for all non-local (TCP) connections.
hostssl  all       all   0.0.0.0/0     scram-sha-256
hostssl  all       all   ::/0          scram-sha-256

# Deny any remaining plaintext (non-SSL) remote connections.
host     all       all   0.0.0.0/0     reject
host     all       all   ::/0          reject
