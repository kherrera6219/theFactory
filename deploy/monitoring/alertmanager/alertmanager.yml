global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    - matchers:
        - severity =~ critical|high
      receiver: pager

receivers:
  - name: default
    webhook_configs:
      - url: http://localhost:9999/alert
        send_resolved: true
  - name: pager
    webhook_configs:
      - url: ${PAGER_WEBHOOK_URL}
        send_resolved: true
