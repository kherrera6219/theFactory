global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    - matchers:
        - severity = critical
      receiver: critical

receivers:
  - name: default
    webhook_configs:
      - url: http://localhost:9999/alert
        send_resolved: true
  - name: critical
    webhook_configs:
      - url: http://localhost:9999/critical
        send_resolved: true
