global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-gateway:8000

  - job_name: orchestrator
    metrics_path: /metrics
    static_configs:
      - targets:
          - orchestrator:8001

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
