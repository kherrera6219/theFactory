global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-gateway:8000

  - job_name: orchestrator
    metrics_path: /metrics
    static_configs:
      - targets:
          - orchestrator:8001

  - job_name: semantic-bus-mcp
    metrics_path: /metrics
    static_configs:
      - targets:
          - semantic-bus-mcp:8090

  - job_name: pod-workers
    metrics_path: /metrics
    static_configs:
      - targets:
          - pod-a-worker:8201
          - pod-b-worker:8201
          - pod-c-worker:8201
          - pod-d-worker:8201

  - job_name: audit-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - audit-worker:8202

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
