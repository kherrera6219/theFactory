groups:
  - name: thefactory-service-health
    rules:
      - alert: ApiGatewayDown
        expr: up{job="api-gateway"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: API gateway is down
          description: Prometheus cannot scrape api-gateway for 2 minutes.

      - alert: OrchestratorDown
        expr: up{job="orchestrator"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Orchestrator is down
          description: Prometheus cannot scrape orchestrator for 2 minutes.

      - alert: ProtocolBusMcpDown
        expr: up{job="protocol-bus-mcp"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Protocol Bus MCP is down
          description: Prometheus cannot scrape protocol-bus-mcp for 2 minutes.

      - alert: PodWorkerDown
        expr: min(up{job="pod-workers"}) == 0
        for: 2m
        labels:
          severity: high
        annotations:
          summary: One or more pod workers are down
          description: At least one pod worker target has been unreachable for 2 minutes.

      - alert: AuditWorkerDown
        expr: up{job="audit-worker"} == 0
        for: 2m
        labels:
          severity: high
        annotations:
          summary: Audit worker is down
          description: Prometheus cannot scrape audit-worker for 2 minutes.

  - name: thefactory-api-errors
    rules:
      - alert: ApiGateway5xxRateHigh
        expr: sum(rate(api_gateway_http_requests_total{status_code=~"5.."}[5m])) > 0.1
        for: 10m
        labels:
          severity: high
        annotations:
          summary: API gateway 5xx error rate is elevated
          description: 5xx rate is above 0.1 req/s for 10 minutes.

      - alert: Orchestrator5xxRateHigh
        expr: sum(rate(orchestrator_http_requests_total{status_code=~"5.."}[5m])) > 0.1
        for: 10m
        labels:
          severity: high
        annotations:
          summary: Orchestrator 5xx error rate is elevated
          description: 5xx rate is above 0.1 req/s for 10 minutes.

  - name: thefactory-slo-burn
    rules:
      - alert: ApiGatewayErrorBudgetBurnFast
        expr: (sum(rate(api_gateway_http_requests_total{status_code=~"5.."}[5m])) / clamp_min(sum(rate(api_gateway_http_requests_total[5m])), 0.001)) > 0.0144
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: API gateway is consuming error budget too quickly
          description: API gateway 5xx burn rate is above 14.4x the 99.9% availability budget over 5 minutes.
          runbook: docs/OPERATIONS_RUNBOOK.md

      - alert: ApiGatewayErrorBudgetBurnSlow
        expr: (sum(rate(api_gateway_http_requests_total{status_code=~"5.."}[1h])) / clamp_min(sum(rate(api_gateway_http_requests_total[1h])), 0.001)) > 0.006
        for: 30m
        labels:
          severity: high
        annotations:
          summary: API gateway error budget burn is elevated
          description: API gateway 5xx burn rate is above 6x the 99.9% availability budget over 1 hour.
          runbook: docs/OPERATIONS_RUNBOOK.md

      - alert: OrchestratorErrorBudgetBurnFast
        expr: (sum(rate(orchestrator_http_requests_total{status_code=~"5.."}[5m])) / clamp_min(sum(rate(orchestrator_http_requests_total[5m])), 0.001)) > 0.0144
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Orchestrator is consuming error budget too quickly
          description: Orchestrator 5xx burn rate is above 14.4x the 99.9% availability budget over 5 minutes.
          runbook: docs/OPERATIONS_RUNBOOK.md

      - alert: OrchestratorErrorBudgetBurnSlow
        expr: (sum(rate(orchestrator_http_requests_total{status_code=~"5.."}[1h])) / clamp_min(sum(rate(orchestrator_http_requests_total[1h])), 0.001)) > 0.006
        for: 30m
        labels:
          severity: high
        annotations:
          summary: Orchestrator error budget burn is elevated
          description: Orchestrator 5xx burn rate is above 6x the 99.9% availability budget over 1 hour.
          runbook: docs/OPERATIONS_RUNBOOK.md

      - alert: PodWorkerAgentLatencyP99High
        expr: histogram_quantile(0.99, sum by (le, agent_id) (rate(pod_worker_task_latency_seconds_bucket{agent_id!="UNKNOWN"}[10m]))) > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Pod worker agent latency is elevated
          description: Pod worker p99 task latency is above 20s for agent {{ $labels.agent_id }}.
          runbook: docs/OPERATIONS_RUNBOOK.md

      - alert: DedicatedAgentRuntimeLatencyP99High
        expr: histogram_quantile(0.99, sum by (le, agent_id) (rate(agent_runtime_task_latency_seconds_bucket[10m]))) > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Dedicated agent runtime latency is elevated
          description: Dedicated runtime p99 task latency is above 20s for agent {{ $labels.agent_id }}.
          runbook: docs/OPERATIONS_RUNBOOK.md

      - alert: AuditWorkerAgentLatencyP99High
        expr: histogram_quantile(0.99, sum by (le, agent_id) (rate(audit_worker_task_latency_seconds_bucket[10m]))) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Audit worker latency is elevated
          description: Audit worker p99 task latency is above 10s for agent {{ $labels.agent_id }}.
          runbook: docs/OPERATIONS_RUNBOOK.md

  - name: thefactory-optional-data-plane
    rules:
      - alert: Neo4jAdapterNotReady
        expr: max(orchestrator_optional_adapter_enabled{adapter="neo4j"}) > 0 and max(orchestrator_optional_adapter_ready{adapter="neo4j"}) < 1
        for: 5m
        labels:
          severity: high
        annotations:
          summary: Neo4j optional adapter is not ready
          description: Neo4j adapter is enabled but has reported not-ready for 5 minutes.
          runbook: docs/runbooks/optional_data_plane_incident_runbook.md

      - alert: ObjectStorageAdapterNotReady
        expr: max(orchestrator_optional_adapter_enabled{adapter="object_storage"}) > 0 and max(orchestrator_optional_adapter_ready{adapter="object_storage"}) < 1
        for: 5m
        labels:
          severity: high
        annotations:
          summary: Object storage optional adapter is not ready
          description: Object storage adapter is enabled but has reported not-ready for 5 minutes.
          runbook: docs/runbooks/optional_data_plane_incident_runbook.md

      - alert: Neo4jMirrorWriteErrorRateHigh
        expr: (sum(rate(orchestrator_optional_adapter_mirror_writes_total{adapter="neo4j",status="error"}[10m])) / clamp_min(sum(rate(orchestrator_optional_adapter_mirror_writes_total{adapter="neo4j"}[10m])), 0.001)) > 0.05
        for: 10m
        labels:
          severity: high
        annotations:
          summary: Neo4j mirror-write error rate is elevated
          description: Neo4j mirror writes error ratio is above 5% for 10 minutes.
          runbook: docs/runbooks/optional_data_plane_incident_runbook.md

      - alert: ObjectStorageMirrorWriteErrorRateHigh
        expr: (sum(rate(orchestrator_optional_adapter_mirror_writes_total{adapter="object_storage",status="error"}[10m])) / clamp_min(sum(rate(orchestrator_optional_adapter_mirror_writes_total{adapter="object_storage"}[10m])), 0.001)) > 0.05
        for: 10m
        labels:
          severity: high
        annotations:
          summary: Object storage mirror-write error rate is elevated
          description: Object storage mirror writes error ratio is above 5% for 10 minutes.
          runbook: docs/runbooks/optional_data_plane_incident_runbook.md

      - alert: Neo4jMirrorWriteLatencyP95High
        expr: histogram_quantile(0.95, sum by (le) (rate(orchestrator_optional_adapter_mirror_write_latency_seconds_bucket{adapter="neo4j"}[10m]))) > 0.75
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Neo4j mirror-write latency p95 is elevated
          description: p95 Neo4j mirror-write latency is above 750ms for 10 minutes.
          runbook: docs/runbooks/optional_data_plane_incident_runbook.md

      - alert: ObjectStorageMirrorWriteLatencyP95High
        expr: histogram_quantile(0.95, sum by (le) (rate(orchestrator_optional_adapter_mirror_write_latency_seconds_bucket{adapter="object_storage"}[10m]))) > 1.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Object storage mirror-write latency p95 is elevated
          description: p95 object storage mirror-write latency is above 1.5s for 10 minutes.
          runbook: docs/runbooks/optional_data_plane_incident_runbook.md
