server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
    # Parse the structured JSON logs the services emit (LOG_FORMAT=json) so
    # level/service/trace_id become queryable fields instead of raw strings.
    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            trace_id: trace_id
            message: message
      - labels:
          level:
          service:
      - output:
          source: message
