# docker-compose.installer.yaml — Electron-packaged installer overrides
#
# Applied on top of docker-compose.yaml by the desktop app
# (apps/mission-control/electron/factory-stack.ts):
#   docker compose --project-name thefactory-app --env-file <backend.env> \
#     -f docker-compose.yaml -f docker-compose.installer.yaml up -d --no-build
#
# The packaged app doesn't ship the monorepo, so it cannot build images from
# source. This overlay replaces every `build:` context in the base file with
# the image the release workflow publishes to GHCR
# (.github/workflows/release.yml, publish-images). test_installer_overlay_*
# fails if a service with a build context is left uncovered -- that would make
# a user's first `up` try to build from source it does not have.
#
# FACTORY_IMAGE_TAG is written into backend.env by the app on every start as
# "v" + its own version, so an installed app always runs the images released
# with it -- never whatever ":latest" happens to be.
#
# Uses the condensed topology (docker-compose.yaml alone, not the
# full-dedicated overlay) to keep the footprint modest on an end-user machine.

services:
  orchestrator:
    image: ${FACTORY_IMAGE_REGISTRY:-ghcr.io/kherrera6219}/thefactory-orchestrator:${FACTORY_IMAGE_TAG:-latest}
  # Built from the orchestrator Dockerfile; runs the same image in runner mode.
  sandbox-runner:
    image: ${FACTORY_IMAGE_REGISTRY:-ghcr.io/kherrera6219}/thefactory-orchestrator:${FACTORY_IMAGE_TAG:-latest}
  api-gateway:
    image: ${FACTORY_IMAGE_REGISTRY:-ghcr.io/kherrera6219}/thefactory-api-gateway:${FACTORY_IMAGE_TAG:-latest}
  protocol-bus-mcp:
    image: ${FACTORY_IMAGE_REGISTRY:-ghcr.io/kherrera6219}/thefactory-protocol-bus-mcp:${FACTORY_IMAGE_TAG:-latest}
  dashboard:
    image: ${FACTORY_IMAGE_REGISTRY:-ghcr.io/kherrera6219}/thefactory-dashboard:${FACTORY_IMAGE_TAG:-latest}
  mission-control:
    image: ${FACTORY_IMAGE_REGISTRY:-ghcr.io/kherrera6219}/thefactory-mission-control:${FACTORY_IMAGE_TAG:-latest}
  audit-worker:
    image: ${FACTORY_IMAGE_REGISTRY:-ghcr.io/kherrera6219}/thefactory-audit-worker:${FACTORY_IMAGE_TAG:-latest}
  pod-a-worker:
    image: ${FACTORY_IMAGE_REGISTRY:-ghcr.io/kherrera6219}/thefactory-pod-worker:${FACTORY_IMAGE_TAG:-latest}
  pod-b-worker:
    image: ${FACTORY_IMAGE_REGISTRY:-ghcr.io/kherrera6219}/thefactory-pod-worker:${FACTORY_IMAGE_TAG:-latest}
  pod-c-worker:
    image: ${FACTORY_IMAGE_REGISTRY:-ghcr.io/kherrera6219}/thefactory-pod-worker:${FACTORY_IMAGE_TAG:-latest}
  pod-d-worker:
    image: ${FACTORY_IMAGE_REGISTRY:-ghcr.io/kherrera6219}/thefactory-pod-worker:${FACTORY_IMAGE_TAG:-latest}
  pod-a-dedicated-mgr-worker:
    image: ${FACTORY_IMAGE_REGISTRY:-ghcr.io/kherrera6219}/thefactory-pod-worker:${FACTORY_IMAGE_TAG:-latest}
  pod-b-dedicated-mgr-worker:
    image: ${FACTORY_IMAGE_REGISTRY:-ghcr.io/kherrera6219}/thefactory-pod-worker:${FACTORY_IMAGE_TAG:-latest}
  pod-c-dedicated-mgr-worker:
    image: ${FACTORY_IMAGE_REGISTRY:-ghcr.io/kherrera6219}/thefactory-pod-worker:${FACTORY_IMAGE_TAG:-latest}
  pod-d-dedicated-mgr-worker:
    image: ${FACTORY_IMAGE_REGISTRY:-ghcr.io/kherrera6219}/thefactory-pod-worker:${FACTORY_IMAGE_TAG:-latest}
