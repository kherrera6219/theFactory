          "import urllib.request; urllib.request.urlopen('http://localhost:8201/readyz', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 512m
    cpus: 0.5

  audit-worker:
    <<: [*common-service, *runtime-service-hardening, *readonly-service-hardening]
    build:
      context: ..
      dockerfile: services/audit-worker/Dockerfile
    environment:
      <<: *platform-agent-service-keys
      REDIS_URL: rediss://:${REDIS_PASSWORD:-CHANGE_ME_local_dev_redis_password_32chars}@redis:6380/0?ssl_cert_reqs=required&ssl_ca_certs=/run/redis-certs/ca.crt
      STATE_STREAM: missions.state
      AUDIT_WORKER_GROUP: audit-workers
      AUDIT_WORKER_NAME: audit-01
      WORKER_AGENT_ID: AGENT-10-TESTER
      AGENT_SERVICE_KEY_MODE: ${AGENT_SERVICE_KEY_MODE:-shared}
      ORCHESTRATOR_URL: http://orchestrator:8001
      SERVICE_API_KEY: ${AUDIT_SERVICE_API_KEY:-${INTERNAL_SERVICE_API_KEY:-CHANGE_ME_local_dev_internal_service_key_32chars}}
    volumes: *redis-client-certs
    depends_on:
      redis:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8202/readyz', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 768m
    cpus: 0.75

volumes:
  redis-data:
  qdrant-data:
  neo4j-data:
  postgres-data:
  minio-data:
  milvus-data:
  mission-control-vault:

networks:
  hgr-network:
    name: hgr-network
    driver: bridge


