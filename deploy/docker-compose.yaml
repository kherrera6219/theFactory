x-common-service: &common-service
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "100m"
      max-file: "5"
  networks:
    - hgr-network

x-runtime-service-hardening: &runtime-service-hardening
  cap_drop:
    - ALL
  cap_add: []
  oom_score_adj: ${APP_OOM_SCORE_ADJ:--500}

x-readonly-service-hardening: &readonly-service-hardening
  read_only: true
  tmpfs:
    - /tmp
  ulimits:
    nofile:
      soft: 65536
      hard: 65536

x-data-service-hardening: &data-service-hardening
  oom_score_adj: ${DATA_SERVICE_OOM_SCORE_ADJ:--850}

x-redis-client-certs: &redis-client-certs
  - ./.local/redis-certs:/run/redis-certs:ro

x-postgres-client-certs: &postgres-client-certs
  - ./.local/postgres-certs:/run/postgres-certs:ro

x-platform-agent-service-keys: &platform-agent-service-keys
  AGENT_01_PM_SERVICE_API_KEY: ${AGENT_01_PM_SERVICE_API_KEY:-}
  AGENT_02_CEO_SERVICE_API_KEY: ${AGENT_02_CEO_SERVICE_API_KEY:-}
  AGENT_03_BROKER_SERVICE_API_KEY: ${AGENT_03_BROKER_SERVICE_API_KEY:-}
  AGENT_04_ACCOUNTANT_SERVICE_API_KEY: ${AGENT_04_ACCOUNTANT_SERVICE_API_KEY:-}
  AGENT_05_SECURITY_SERVICE_API_KEY: ${AGENT_05_SECURITY_SERVICE_API_KEY:-}
  AGENT_06_IS_SERVICE_API_KEY: ${AGENT_06_IS_SERVICE_API_KEY:-}
  AGENT_07_VC_SERVICE_API_KEY: ${AGENT_07_VC_SERVICE_API_KEY:-}
  AGENT_08_COMPLIANCE_SERVICE_API_KEY: ${AGENT_08_COMPLIANCE_SERVICE_API_KEY:-}
  AGENT_09_HW_SERVICE_API_KEY: ${AGENT_09_HW_SERVICE_API_KEY:-}
  AGENT_10_TESTER_SERVICE_API_KEY: ${AGENT_10_TESTER_SERVICE_API_KEY:-}
  AGENT_11_DEPLOY_SERVICE_API_KEY: ${AGENT_11_DEPLOY_SERVICE_API_KEY:-}

x-pod-a-agent-service-keys: &pod-a-agent-service-keys
  AGENT_12_PODA_MGR_SERVICE_API_KEY: ${AGENT_12_PODA_MGR_SERVICE_API_KEY:-}
  AGENT_13_PODA_AUDIT_SERVICE_API_KEY: ${AGENT_13_PODA_AUDIT_SERVICE_API_KEY:-}
  AGENT_14_PYTHON_SERVICE_API_KEY: ${AGENT_14_PYTHON_SERVICE_API_KEY:-}
  AGENT_15_JAVASCRIPT_SERVICE_API_KEY: ${AGENT_15_JAVASCRIPT_SERVICE_API_KEY:-}
  AGENT_16_RUBY_SERVICE_API_KEY: ${AGENT_16_RUBY_SERVICE_API_KEY:-}
  AGENT_17_PHP_SERVICE_API_KEY: ${AGENT_17_PHP_SERVICE_API_KEY:-}

x-pod-b-agent-service-keys: &pod-b-agent-service-keys
  AGENT_18_PODB_MGR_SERVICE_API_KEY: ${AGENT_18_PODB_MGR_SERVICE_API_KEY:-}
  AGENT_19_PODB_AUDIT_SERVICE_API_KEY: ${AGENT_19_PODB_AUDIT_SERVICE_API_KEY:-}
  AGENT_20_C_SERVICE_API_KEY: ${AGENT_20_C_SERVICE_API_KEY:-}
  AGENT_21_CPP_SERVICE_API_KEY: ${AGENT_21_CPP_SERVICE_API_KEY:-}
  AGENT_22_RUST_SERVICE_API_KEY: ${AGENT_22_RUST_SERVICE_API_KEY:-}
  AGENT_23_ZIG_SERVICE_API_KEY: ${AGENT_23_ZIG_SERVICE_API_KEY:-}
  AGENT_36_GO_SERVICE_API_KEY: ${AGENT_36_GO_SERVICE_API_KEY:-}

x-pod-c-agent-service-keys: &pod-c-agent-service-keys
  AGENT_24_PODC_MGR_SERVICE_API_KEY: ${AGENT_24_PODC_MGR_SERVICE_API_KEY:-}
  AGENT_25_PODC_AUDIT_SERVICE_API_KEY: ${AGENT_25_PODC_AUDIT_SERVICE_API_KEY:-}
  AGENT_26_JAVA_SERVICE_API_KEY: ${AGENT_26_JAVA_SERVICE_API_KEY:-}
  AGENT_27_CSHARP_SERVICE_API_KEY: ${AGENT_27_CSHARP_SERVICE_API_KEY:-}
  AGENT_28_SCALA_SERVICE_API_KEY: ${AGENT_28_SCALA_SERVICE_API_KEY:-}
  AGENT_29_KOTLIN_SERVICE_API_KEY: ${AGENT_29_KOTLIN_SERVICE_API_KEY:-}

x-pod-d-agent-service-keys: &pod-d-agent-service-keys
  AGENT_30_PODD_MGR_SERVICE_API_KEY: ${AGENT_30_PODD_MGR_SERVICE_API_KEY:-}
  AGENT_31_PODD_AUDIT_SERVICE_API_KEY: ${AGENT_31_PODD_AUDIT_SERVICE_API_KEY:-}
  AGENT_32_MATLAB_SERVICE_API_KEY: ${AGENT_32_MATLAB_SERVICE_API_KEY:-}
  AGENT_33_R_SERVICE_API_KEY: ${AGENT_33_R_SERVICE_API_KEY:-}
  AGENT_34_JULIA_SERVICE_API_KEY: ${AGENT_34_JULIA_SERVICE_API_KEY:-}
  AGENT_35_MATHEMATICA_SERVICE_API_KEY: ${AGENT_35_MATHEMATICA_SERVICE_API_KEY:-}
  AGENT_37_HASKELL_SERVICE_API_KEY: ${AGENT_37_HASKELL_SERVICE_API_KEY:-}
  AGENT_38_OCAML_SERVICE_API_KEY: ${AGENT_38_OCAML_SERVICE_API_KEY:-}

services:
  redis:
    <<: [*common-service, *data-service-hardening]
    image: redis:7.2-alpine
    entrypoint:
      - /bin/sh
      - /usr/local/bin/docker-entrypoint-init-tls.sh
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:-CHANGE_ME_local_dev_redis_password_32chars}
    ports:
      - "${REDIS_HOST_BIND:-127.0.0.1}:${REDIS_HOST_PORT:-6380}:6380"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/entrypoint.sh:/usr/local/bin/docker-entrypoint-init-tls.sh:ro
      - ./.local/redis-certs:/usr/local/etc/redis/certs:ro
      - redis-data:/data
    mem_limit: 3g
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --tls --cacert /usr/local/etc/redis/certs/ca.crt -p 6380 -a ${REDIS_PASSWORD:-CHANGE_ME_local_dev_redis_password_32chars} ping | grep PONG",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  qdrant:
    <<: [*common-service, *data-service-hardening]
    image: qdrant/qdrant:v1.12.1
    ports:
      - "${QDRANT_HOST_BIND:-127.0.0.1}:${QDRANT_HOST_PORT:-6334}:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  neo4j:
    <<: [*common-service, *data-service-hardening]
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-CHANGE_ME_local_dev_neo4j_password}
    ports:
      - "${NEO4J_HTTP_HOST_BIND:-127.0.0.1}:${NEO4J_HTTP_HOST_PORT:-7474}:7474"
      - "${NEO4J_BOLT_HOST_BIND:-127.0.0.1}:${NEO4J_BOLT_HOST_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:7474 >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  postgres:
    <<: [*common-service, *data-service-hardening]
    image: postgres:16
    entrypoint:
      - /bin/bash
      - /docker-entrypoint-init-tls.sh
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_local_dev_postgres_password_32chars}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ulr}
    ports:
      - "${POSTGRES_HOST_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - ./postgres/entrypoint.sh:/docker-entrypoint-init-tls.sh:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./.local/postgres-certs:/run/postgres-certs:ro
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 4g
    mem_reservation: 2g
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h localhost -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ulr}",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  pgbouncer:
    <<: [*common-service, *data-service-hardening]
    image: edoburu/pgbouncer:v1.24.1-p1
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_local_dev_postgres_password_32chars}
      DB_NAME: ${POSTGRES_DB:-ulr}
      # Transaction pooling is the standard mode for stateless Python microservices.
      # NOTE: SET (session), LISTEN/NOTIFY, and protocol-level prepared statements are
      # NOT supported in this mode. Verified absent from the codebase before enabling.
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 5
      AUTH_TYPE: scram-sha-256
      # PgBouncer -> Postgres uses verify-full TLS against the same CA the
      # orchestrator used for its previous direct connection, so the bouncer hop
      # does not weaken transport security to the real database. The orchestrator
      # -> PgBouncer hop stays on the internal hgr-network (sslmode=disable in the
      # POSTGRES_URL) because the edoburu image does not ship a server cert.
      SERVER_TLS_SSLMODE: verify-full
      SERVER_TLS_CA_FILE: /run/postgres-certs/ca.crt
    volumes: *postgres-client-certs
    ports:
      - "127.0.0.1:${PGBOUNCER_HOST_PORT:-5434}:${PGBOUNCER_PORT:-5432}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "${PGBOUNCER_PORT:-5432}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 256m
    cpus: 0.5

  minio:
    <<: [*common-service, *data-service-hardening]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_HOST_BIND:-127.0.0.1}:${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_BIND:-127.0.0.1}:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  milvus:
    <<: [*common-service, *data-service-hardening]
    image: milvusdb/milvus:v2.4.13
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: "/var/lib/milvus/etcd"
      COMMON_STORAGETYPE: "local"
    ports:
      - "${MILVUS_HOST_BIND:-127.0.0.1}:${MILVUS_HOST_PORT:-19530}:19530"
      - "${MILVUS_METRICS_HOST_BIND:-127.0.0.1}:${MILVUS_METRICS_HOST_PORT:-9091}:9091"
    volumes:
      - milvus-data:/var/lib/milvus

  jaeger:
    <<: [*common-service, *data-service-hardening]
    image: jaegertracing/all-in-one:1.59
    command:
      - "--collector.otlp.http.host-port=0.0.0.0:4318"
      - "--collector.otlp.grpc.host-port=0.0.0.0:4317"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_HOST_BIND:-127.0.0.1}:${JAEGER_UI_HOST_PORT:-16686}:16686"
      - "${OTLP_GRPC_HOST_BIND:-127.0.0.1}:${OTLP_GRPC_HOST_PORT:-4317}:4317"
      - "${OTLP_HTTP_HOST_BIND:-127.0.0.1}:${OTLP_HTTP_HOST_PORT:-4318}:4318"

  orchestrator:
    <<: [*common-service, *runtime-service-hardening, *readonly-service-hardening]
    build:
      context: ..
      dockerfile: services/orchestrator/Dockerfile
    environment:
      <<: [*platform-agent-service-keys, *pod-a-agent-service-keys, *pod-b-agent-service-keys, *pod-c-agent-service-keys, *pod-d-agent-service-keys]
      REDIS_URL: rediss://:${REDIS_PASSWORD:-CHANGE_ME_local_dev_redis_password_32chars}@redis:6380/0?ssl_cert_reqs=required&ssl_ca_certs=/run/redis-certs/ca.crt
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_ENABLED: ${QDRANT_ENABLED:-true}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-mission_knowledge}
      QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-256}
      QDRANT_TIMEOUT_SECONDS: ${QDRANT_TIMEOUT_SECONDS:-3.0}
      KNOWLEDGE_EMBEDDING_PROVIDER: ${KNOWLEDGE_EMBEDDING_PROVIDER:-deterministic}
      KNOWLEDGE_EMBEDDING_MODEL: ${KNOWLEDGE_EMBEDDING_MODEL:-deterministic-hash-v1}
      KNOWLEDGE_EMBEDDING_API_KEY: ${KNOWLEDGE_EMBEDDING_API_KEY:-}
      KNOWLEDGE_EMBEDDING_TIMEOUT_SECONDS: ${KNOWLEDGE_EMBEDDING_TIMEOUT_SECONDS:-10.0}
      KNOWLEDGE_REFRESH_ENABLED: ${KNOWLEDGE_REFRESH_ENABLED:-true}
      NEO4J_ENABLED: ${NEO4J_ENABLED:-true}
      NEO4J_URL: ${NEO4J_URL:-http://neo4j:7474}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-CHANGE_ME_local_dev_neo4j_password}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      NEO4J_TIMEOUT_SECONDS: ${NEO4J_TIMEOUT_SECONDS:-3.0}
      OBJECT_STORAGE_ENABLED: ${OBJECT_STORAGE_ENABLED:-true}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin123}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-mission-audit-artifacts}
      OBJECT_STORAGE_PREFIX: ${OBJECT_STORAGE_PREFIX:-missions}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_TIMEOUT_SECONDS: ${OBJECT_STORAGE_TIMEOUT_SECONDS:-5.0}
      OBJECT_STORAGE_RETENTION_DAYS: ${OBJECT_STORAGE_RETENTION_DAYS:-90}
      OBJECT_STORAGE_LEGAL_HOLD_ON_FAIL: ${OBJECT_STORAGE_LEGAL_HOLD_ON_FAIL:-true}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-true}
      OBJECT_STORAGE_REQUIRE_TLS: ${OBJECT_STORAGE_REQUIRE_TLS:-false}
      MILVUS_ENABLED: ${MILVUS_ENABLED:-true}
      MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-mission_knowledge}
      MILVUS_VECTOR_SIZE: ${MILVUS_VECTOR_SIZE:-64}
      MILVUS_TIMEOUT_SECONDS: ${MILVUS_TIMEOUT_SECONDS:-3.0}
      # Routed through the PgBouncer sidecar (transaction pooling). The bouncer
      # holds the verify-full TLS connection to the real Postgres; this hop stays
      # on the internal network so sslmode=disable is used here.
      POSTGRES_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-CHANGE_ME_local_dev_postgres_password_32chars}@pgbouncer:${PGBOUNCER_PORT:-5432}/${POSTGRES_DB:-ulr}?sslmode=disable
      # Schema migrations take a session-level advisory lock and must bypass the
      # bouncer (transaction pooling drops session locks between statements), so
      # they connect to Postgres directly over verify-full TLS.
      MIGRATION_POSTGRES_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-CHANGE_ME_local_dev_postgres_password_32chars}@postgres:5432/${POSTGRES_DB:-ulr}?sslmode=verify-full&sslrootcert=/run/postgres-certs/ca.crt
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      INTAKE_STREAM: missions.intake
      INTAKE_TOPIC: intake.feature_contract.created
      STATE_STREAM: missions.state
      MAX_STREAM_LEN: 20000
      MISSION_CONSUMER_GROUP: orchestrator
      MISSION_CONSUMER_NAME: orchestrator-01
      AUTO_TRANSITION_ENABLED: ${AUTO_TRANSITION_ENABLED:-true}
      TRANSITION_STEP_SECONDS: ${TRANSITION_STEP_SECONDS:-1.0}
      MISSION_FLOW_V2_ENABLED: ${MISSION_FLOW_V2_ENABLED:-true}
      EVENT_DRIVEN_CONTROL_PLANE_ENABLED: ${EVENT_DRIVEN_CONTROL_PLANE_ENABLED:-false}
      TESTDATA_AGENT_ENABLED: ${TESTDATA_AGENT_ENABLED:-false}
      RQCA_AGENT_ENABLED: ${RQCA_AGENT_ENABLED:-false}
      RQCA_ENFORCEMENT_ENABLED: ${RQCA_ENFORCEMENT_ENABLED:-false}
      DOCKER_BIN: ${DOCKER_BIN:-docker}
      DEPABS_EXECUTION_ENABLED: ${DEPABS_EXECUTION_ENABLED:-false}
      LANGGRAPH_ENABLED: ${LANGGRAPH_ENABLED:-false}
      LANGGRAPH_FAIL_OPEN: ${LANGGRAPH_FAIL_OPEN:-true}
      LANGGRAPH_CHECKPOINTER: ${LANGGRAPH_CHECKPOINTER:-none}
      LANGGRAPH_THREAD_PREFIX: ${LANGGRAPH_THREAD_PREFIX:-mission}
      # LangGraph's Postgres checkpointer requires a stable direct Postgres
      # session. Do not default this to PgBouncer; operators must opt in with a
      # direct URL when LANGGRAPH_CHECKPOINTER=postgres.
      LANGGRAPH_CHECKPOINTER_POSTGRES_URL: ${LANGGRAPH_CHECKPOINTER_POSTGRES_URL:-}
      LANGGRAPH_CHECKPOINTER_SETUP: ${LANGGRAPH_CHECKPOINTER_SETUP:-false}
      LANGGRAPH_CHECKPOINT_NAMESPACE: ${LANGGRAPH_CHECKPOINT_NAMESPACE:-}
      ORCHESTRATOR_ADMIN_API_KEY: ${ORCHESTRATOR_ADMIN_API_KEY:-}
      INTERNAL_SERVICE_API_KEY: ${INTERNAL_SERVICE_API_KEY:-}
      ORCHESTRATOR_READONLY_API_KEY: ${ORCHESTRATOR_READONLY_API_KEY:-}
      ORCHESTRATOR_API_KEYS: ${ORCHESTRATOR_API_KEYS:-}
      ORCHESTRATOR_PORT: 8001
      PROTOCOL_BUS_URL: ${PROTOCOL_BUS_URL:-http://protocol-bus-mcp:8090}
      PROTOCOL_BUS_API_KEY: ${PROTOCOL_BUS_API_KEY:-${MCP_API_KEY:-}}
      PROTOCOL_BUS_CONSUMER_ENABLED: ${PROTOCOL_BUS_CONSUMER_ENABLED:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-20}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-high}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com/v1}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      ANTHROPIC_TIMEOUT_SECONDS: ${ANTHROPIC_TIMEOUT_SECONDS:-20}
      ANTHROPIC_VERSION: ${ANTHROPIC_VERSION:-2023-06-01}
      ANTHROPIC_THINKING_MODE: ${ANTHROPIC_THINKING_MODE:-enabled}
      ANTHROPIC_THINKING_BUDGET_TOKENS: ${ANTHROPIC_THINKING_BUDGET_TOKENS:-8192}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-20}
      GEMINI_THINKING_BUDGET: ${GEMINI_THINKING_BUDGET:--1}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-high}
      OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-true}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
      OTEL_SAMPLING_RATIO: ${OTEL_SAMPLING_RATIO:-0.1}
    volumes:
      # Certs generated by: make tls-certs (Linux/Mac: scripts/generate_dev_tls_certs.sh from repo root)
      # Canonical output path: deploy/.local/redis-certs and deploy/.local/postgres-certs
      - ./.local/redis-certs:/run/redis-certs:ro
      - ./.local/postgres-certs:/run/postgres-certs:ro
      - ../output:/app/output
    ports:
      - "${ORCHESTRATOR_HOST_BIND:-127.0.0.1}:${ORCHESTRATOR_HOST_PORT:-8101}:8001"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      # Liveness, not readiness: /health returns 200 whenever the process is
      # serving even if an optional service (Qdrant/Neo4j/object storage) is
      # unavailable. Dependents gate on this signal via depends_on, so coupling
      # it to optional-service readiness (as /readyz does) would wedge reduced
      # local stacks when optional backends are intentionally disabled. /readyz
      # remains the stricter readiness signal.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=4).read()",
        ]
      interval: 10s
      timeout: 6s
      retries: 5
      # First boot runs schema migrations and primes the connection pool before
      # /health reports db_ready; give that work room on cold CI runners so the
      # probe does not flap before the orchestrator finishes initializing.
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 1g
    cpus: 1.0

  api-gateway:
    <<: [*common-service, *runtime-service-hardening, *readonly-service-hardening]
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8001
      REDIS_URL: rediss://:${REDIS_PASSWORD:-CHANGE_ME_local_dev_redis_password_32chars}@redis:6380/0?ssl_cert_reqs=required&ssl_ca_certs=/run/redis-certs/ca.crt
