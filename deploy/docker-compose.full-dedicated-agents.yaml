x-common-service: &common-service
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "100m"
      max-file: "5"
  networks:
    - hgr-network

x-runtime-service-hardening: &runtime-service-hardening
  cap_drop:
    - ALL
  cap_add: []
  oom_score_adj: ${APP_OOM_SCORE_ADJ:--500}

x-readonly-service-hardening: &readonly-service-hardening
  read_only: true
  tmpfs:
    - /tmp
  ulimits:
    nofile:
      soft: 65536
      hard: 65536

x-redis-client-certs: &redis-client-certs
  - ./.local/redis-certs:/run/redis-certs:ro

x-agent-runtime-env: &agent-runtime-env
  REDIS_URL: rediss://:${REDIS_PASSWORD:-CHANGE_ME_local_dev_redis_password_32chars}@redis:6380/0?ssl_cert_reqs=required&ssl_ca_certs=/run/redis-certs/ca.crt
  STATE_STREAM: missions.state
  ORCHESTRATOR_URL: http://orchestrator:8001
  SERVICE_API_KEY: ${INTERNAL_SERVICE_API_KEY:-}
  OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-true}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}

x-agent-runtime-template: &agent-runtime-template
  <<: [*common-service, *runtime-service-hardening, *readonly-service-hardening]
  build:
    context: ..
    dockerfile: services/agent-runtime/Dockerfile
  profiles:
    - full-dedicated-agents
  volumes: *redis-client-certs
  depends_on:
    redis:
      condition: service_healthy
    orchestrator:
      condition: service_healthy
  healthcheck:
    test:
      [
        "CMD",
        "python",
        "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8210/health', timeout=2).read()",
      ]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 30s
  mem_limit: 384m
  cpus: 0.35

x-dedicated-pod-worker-env: &dedicated-pod-worker-env
  REDIS_URL: rediss://:${REDIS_PASSWORD:-CHANGE_ME_local_dev_redis_password_32chars}@redis:6380/0?ssl_cert_reqs=required&ssl_ca_certs=/run/redis-certs/ca.crt
  STATE_STREAM: missions.state
  AGENT_SERVICE_KEY_MODE: ${AGENT_SERVICE_KEY_MODE:-shared}
  ORCHESTRATOR_URL: http://orchestrator:8001
  JS_AST_EXTRACTOR_ENABLED: ${JS_AST_EXTRACTOR_ENABLED:-true}
  JAVA_AST_EXTRACTOR_ENABLED: ${JAVA_AST_EXTRACTOR_ENABLED:-true}
  OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-true}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}

x-dedicated-pod-worker-template: &dedicated-pod-worker-template
  <<: [*common-service, *runtime-service-hardening, *readonly-service-hardening]
  build:
    context: ..
    dockerfile: services/pod-worker/Dockerfile
  profiles:
    - full-dedicated-agents
  volumes: *redis-client-certs
  depends_on:
    redis:
      condition: service_healthy
    orchestrator:
      condition: service_healthy
  healthcheck:
    test:
      [
        "CMD",
        "python",
        "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8201/health', timeout=2).read()",
      ]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 30s
  mem_limit: 384m
  cpus: 0.35

