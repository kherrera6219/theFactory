# Production Redis configuration — TLS-only.
#
# Mounted over redis.conf by docker-compose.prod.yaml. The only difference from
# the base config is `port 0`, which disables the plaintext listener entirely so
# the server accepts connections on the TLS port (6380) only.
#
# Dev keeps the plaintext port (base redis.conf) for local debugging.
bind 0.0.0.0
protected-mode yes
# Disable the plaintext port — TLS (6380) is the only accepted listener in prod.
port 0
tls-port 6380
tls-cert-file /usr/local/etc/redis/certs/redis.crt
tls-key-file /usr/local/etc/redis/certs/redis.key
tls-ca-cert-file /usr/local/etc/redis/certs/ca.crt
tls-auth-clients no
dir /data

# Persistence
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
save 900 1
save 300 10
save 60 10000

# Capacity controls
maxmemory 3gb
maxmemory-policy allkeys-lru
tcp-keepalive 300
notify-keyspace-events Ex

loglevel notice
