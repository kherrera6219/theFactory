# docker-compose.prod.yaml — production overrides
#
# Applied on top of docker-compose.yaml:
#   docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d
#
# The base compose already supplies:
#   - CPU limits (cpus:) and memory limits (mem_limit:) per service
#   - Healthcheck blocks (liveness + readiness probe)
#   - read_only: true, cap_drop: ALL, ulimits, tmpfs: /tmp
#   - restart: unless-stopped
#
# This overlay activates production security posture:
#   - PII detection (redact mode)
#   - Prompt injection guard (block mode)
#   - Tighter circuit breaker thresholds for agent-runtime
#   - Lower backpressure limit for protocol bus
#   - OIDC auth enforcement
#   - Reduced log verbosity

services:
  # --- Data plane: TLS-only in production ---
  redis:
    # Mount the TLS-only config (port 0 disables the plaintext 6379 listener).
    # Dev keeps the base redis.conf with plaintext open for local debugging.
    volumes:
      - ./redis/redis.prod.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/entrypoint.sh:/usr/local/bin/docker-entrypoint-init-tls.sh:ro
      - ./.local/redis-certs:/usr/local/etc/redis/certs:ro
      - redis-data:/data

  postgres:
    # Use the prod entrypoint, which points Postgres at an SSL-required
    # pg_hba.conf so plaintext remote connections are rejected (local socket
    # stays trusted for container-internal tooling).
    entrypoint:
      - /bin/bash
      - /docker-entrypoint-init-tls.sh
    volumes:
      - ./postgres/entrypoint.prod.sh:/docker-entrypoint-init-tls.sh:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./.local/postgres-certs:/run/postgres-certs:ro
      - postgres-data:/var/lib/postgresql/data

  api-gateway:
    environment:
      # --- auth ---
      AUTH_MODE: oidc
      API_RATE_LIMIT_PER_MINUTE: 60
      OIDC_ENFORCE_OPERATOR_ROUTES: "true"
      # Restrict algorithms to asymmetric only in prod. HS256 is never accepted
      # when a JWKS is configured — blocks alg-confusion attacks.
      OIDC_ALLOWED_ALGORITHMS: "RS256"
      # --- Phase 2 security features ---
      PII_GUARD_MODE: redact         # redact PII in mission prompts at intake
      PROMPT_GUARD_MODE: block       # block prompt injection attempts in prod
      # --- observability ---
      LOG_LEVEL: WARNING
      LOG_FORMAT: json
      AUDIT_LOG_ENABLED: "true"
      # Sample 10% of traces in prod to bound Jaeger volume / storage.
      OTEL_SAMPLING_RATIO: "0.1"

  orchestrator:
    environment:
      ENVIRONMENT: production
      ARTIFACT_SIGNING_KEY_SOURCE: mounted
      ARTIFACT_SIGNING_KEY_PATH: /run/factory-secrets/artifact-signing-key.pem
      # Each agent authenticates with its own dedicated service key in prod — no
      # shared-identity fallback. The orchestrator logs a SECURITY warning at boot
      # if this is left as "shared" while ENVIRONMENT=production.
      AGENT_SERVICE_KEY_MODE: strict
      # --- LangGraph production settings ---
      LANGGRAPH_ENABLED: "true"
      LANGGRAPH_CHECKPOINTER: postgres
      LANGGRAPH_CHECKPOINTER_SETUP: "true"
      LANGGRAPH_FAIL_OPEN: "false"
      # --- storage ---
      OBJECT_STORAGE_ENABLED: "true"
      # Production object storage must use an HTTPS S3-compatible endpoint.
      # Override OBJECT_STORAGE_ENDPOINT to a TLS endpoint in the prod .env.
      OBJECT_STORAGE_REQUIRE_TLS: "true"
      NEO4J_ENABLED: "true"
      # --- Phase 2 security features ---
      PROMPT_GUARD_MODE: block
      PII_GUARD_MODE: redact
      # --- observability ---
      LOG_LEVEL: WARNING
      LOG_FORMAT: json
      OTEL_SAMPLING_RATIO: "0.1"
    volumes:
      - ${ARTIFACT_SIGNING_KEY_FILE:-./.local/secrets/artifact-signing-key.pem}:/run/factory-secrets/artifact-signing-key.pem:ro

  # Published ports default to 127.0.0.1 in the base compose file. Internal
  # service-to-service traffic uses the Docker bridge network and does not rely
  # on host-published ports.
  protocol-bus-mcp:
    environment:
      # Phase 3 — lower backpressure limit in prod to protect downstream consumers
      MCP_BACKPRESSURE_LIMIT: "5000"
      # Longer dedup TTL in prod (10 minutes) — prevents replay across retries
      MESSAGE_DEDUP_TTL_SECONDS: "600"
      LOG_LEVEL: WARNING
      LOG_FORMAT: json
      ENVIRONMENT: production

  pod-a-worker:
    environment:
      AGENT_SERVICE_KEY_MODE: strict
      LOG_LEVEL: WARNING
      LOG_FORMAT: json

  pod-b-worker:
    environment:
      AGENT_SERVICE_KEY_MODE: strict
      LOG_LEVEL: WARNING
      LOG_FORMAT: json

  pod-c-worker:
    environment:
      AGENT_SERVICE_KEY_MODE: strict
      LOG_LEVEL: WARNING
      LOG_FORMAT: json

  pod-d-worker:
    environment:
      AGENT_SERVICE_KEY_MODE: strict
      LOG_LEVEL: WARNING
      LOG_FORMAT: json

  pod-a-dedicated-mgr-worker:
    environment:
      AGENT_SERVICE_KEY_MODE: strict
      # Phase 3 — tighter circuit breaker for prod (3 failures → open, 60s recovery)
      CIRCUIT_FAILURE_THRESHOLD: "3"
      CIRCUIT_RECOVERY_SECONDS: "60"
      LOG_LEVEL: WARNING
      LOG_FORMAT: json

  pod-b-dedicated-mgr-worker:
    environment:
      AGENT_SERVICE_KEY_MODE: strict
      CIRCUIT_FAILURE_THRESHOLD: "3"
      CIRCUIT_RECOVERY_SECONDS: "60"
      LOG_LEVEL: WARNING
      LOG_FORMAT: json

  pod-c-dedicated-mgr-worker:
    environment:
      AGENT_SERVICE_KEY_MODE: strict
      CIRCUIT_FAILURE_THRESHOLD: "3"
      CIRCUIT_RECOVERY_SECONDS: "60"
      LOG_LEVEL: WARNING
      LOG_FORMAT: json

  pod-d-dedicated-mgr-worker:
    environment:
      AGENT_SERVICE_KEY_MODE: strict
      CIRCUIT_FAILURE_THRESHOLD: "3"
      CIRCUIT_RECOVERY_SECONDS: "60"
      LOG_LEVEL: WARNING
      LOG_FORMAT: json

  audit-worker:
    environment:
      ENVIRONMENT: production
      AGENT_SERVICE_KEY_MODE: strict
      ARTIFACT_SIGNING_KEY_SOURCE: mounted
      ARTIFACT_SIGNING_KEY_PATH: /run/factory-secrets/artifact-signing-key.pem
      LOG_LEVEL: WARNING
      LOG_FORMAT: json
    volumes:
      - ${ARTIFACT_SIGNING_KEY_FILE:-./.local/secrets/artifact-signing-key.pem}:/run/factory-secrets/artifact-signing-key.pem:ro

  dashboard:
    environment:
      API_GATEWAY_URL: http://api-gateway:8000
      DASHBOARD_PORT: 8080
      HGR_RUNTIME_ENV: production
      LOG_LEVEL: WARNING
      LOG_FORMAT: json

  mission-control:
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_GATEWAY_HOST_PORT:-8100}
      NEXT_PUBLIC_RUNTIME_ENV: production
      # Phase 2 — HMAC-signed approvals (secret must be set in .env for prod)
      APPROVAL_TTL_SECONDS: "86400"
      # --- auth hardening (prod) ---
      # Never bypass operator session auth in production.
      OPERATOR_SESSION_BYPASS: "false"
      # Require session cookies to be sent over HTTPS only in production.
      MISSION_CONTROL_SESSION_SECURE: "true"
